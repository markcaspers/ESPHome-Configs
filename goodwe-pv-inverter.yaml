esphome:
  name: wemos-goodwe-omvormer

esp8266:
  board: d1_mini
  
substitutions:
  devicename: wemos_goodwe_omvormer
  friendly_name: Wemos Goodwe Omvormer

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret apikey

ota:
  - platform: esphome
    password: !secret ota_pw

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
# Optional manual IP
#  manual_ip:
#    static_ip: 192.168.0.123
#    gateway: 192.168.0.1
#    subnet: 255.255.255.0

uart:
  id: mod_bus
  tx_pin: D7
  rx_pin: D6
  baud_rate: 9600
  stop_bits: 1
  rx_buffer_size: 1024
  
modbus:
  flow_control_pin: D5
  id: modbus1
  send_wait_time: 1000ms

modbus_controller:
  - id: goodwe
    # the Modbus device addr (defaults to 247 (0xF7) for goodwe inverters)
    address: 0xF7
    modbus_id: modbus1
    setup_priority: -10
    #command_throttle: 250ms
    update_interval: 15s

binary_sensor:
  - platform: status
    name: "${friendly_name} status"

sensor:   
  - platform: uptime
    name: "${friendly_name} uptime seconds"
    id: uptime_sensor
    update_interval: 60s
    on_raw_value:
      then:
        - text_sensor.template.publish:
            id: uptime_human
            state: !lambda |-
              int seconds = round(id(uptime_sensor).raw_state);
              int days = seconds / (24 * 3600);
              seconds = seconds % (24 * 3600);
              int hours = seconds / 3600;
              seconds = seconds % 3600;
              int minutes = seconds /  60;
              seconds = seconds % 60;
              return (
                (days ? to_string(days) + "d " : "") +
                (hours ? to_string(hours) + "h " : "") +
                (minutes ? to_string(minutes) + "m " : "") +
                (to_string(seconds) + "s")
              ).c_str();

  - platform: wifi_signal
    name: "${friendly_name} signal"
    update_interval: 60s
  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: pv_pv1_voltage
    name: "${friendly_name} PV1 voltage"
    address: 0x0300
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: pv_pv2_voltage
    name: "${friendly_name} PV2 voltage"
    address: 0x0301
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: pv_pv1_current
    name: "${friendly_name} PV1 current"
    address: 0x0302
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: pv_pv2_current
    name: "${friendly_name} PV2 current"
    address: 0x0303
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: pv_ac1_voltage
    name: "${friendly_name} AC1 voltage"
    address: 0x0304
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: pv_ac2_voltage
    name: "${friendly_name} AC2 voltage"
    address: 0x0305
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: pv_ac3_voltage
    name: "${friendly_name} AC3 voltage"
    address: 0x0306
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: pv_ac1_current
    name: "${friendly_name} AC1 current"
    address: 0x0307
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: pv_ac2_current
    name: "${friendly_name} AC2 current"
    address: 0x0308
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: pv_ac3_current
    name: "${friendly_name} AC3 current"
    address: 0x0309
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    register_count: 4 # skip 0x30A - 0x30C

  - platform: modbus_controller
    modbus_controller_id: goodwe  
    id: pv_feeding_power
    name: "${friendly_name} Feeding Power"
    address: 0x030D
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    register_count: 2 # skip 0x30E

  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: pv_temperature
    name: "${friendly_name} Temperature"
    address: 0x030F
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    register_type: holding
    value_type: S_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    register_count: 3 # skip 0x310 and 0x311

  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: pv_total_energy
    name: "${friendly_name} Total Energy"
    address: 0x0312
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: pv_total_hours
    name: "${friendly_name} Total Hours"
    address: 0x0314
    unit_of_measurement: "h"
    device_class: duration
    state_class: total
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 0
    register_count: 12 # skip 0x316 - 0x31E

  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: pv_day_energy
    name: "${friendly_name} Day Energy"
    address: 0x0320
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

# --- SENSORS FOR EXPORT CONTROL ---
  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: export_limit_enable_actual_status
    # internal: true # Uncomment if you DON'T want this sensor as a separate entity in Home Assistant
    name: "Export Limit Switch Actual Status"
    address: 291 # Decimal for "On Grid Export Power Limit Switch"
    register_type: holding
    value_type: U_WORD # Expected values 0 (OFF) or 1 (ON)

  - platform: modbus_controller
    modbus_controller_id: goodwe
    id: export_limit_percentage_actual_status
    # internal: true # Uncomment if you DON'T want this sensor as a separate entity in Home Assistant
    name: "Export Limit Percentage Actual Status"
    address: 292 # Decimal for "Set the ARP power percentage"
    register_type: holding
    value_type: U_WORD # Expected values 0-100
    unit_of_measurement: "%"

text_sensor:
  - platform: template
    name: "${friendly_name} uptime formatted"
    id: uptime_human
    icon: mdi:clock-start
  - platform: version
    name: "${friendly_name} version"
  - platform: wifi_info
    bssid:
      name: "${friendly_name} BSSID"
      id: bssid_sensor

switch:
  - platform: restart
    name: "${friendly_name} Restart"

  - platform: modbus_controller
    modbus_controller_id: goodwe
    use_write_multiple: True
    id: export_limit_enable
    register_type: holding
    address: 291
    name: "Power limit enable"
    bitmask: 0x01
    icon: "mdi:toggle-switch"    

number:
  - platform: modbus_controller
    modbus_controller_id: goodwe
    use_write_multiple: True
    name: "Export Limit Percentage"
    register_type: holding
    address: 292
    value_type: U_WORD
    min_value: 0
    max_value: 100   
    entity_category: config